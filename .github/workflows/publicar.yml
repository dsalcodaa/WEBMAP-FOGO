name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia, 07:00 em Brasília: fecha o dia anterior
    - cron: "0 0 * * *"    # todo dia, 21:00 em Brasília: pega a passagem da tarde do satélite de referência
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # o primeiro run baixa ~1 GB de histórico do INPE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: semana
        run: echo "s=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # CAR (~99 mil polígonos) e shapefiles ficam em cache por semana
      - uses: actions/cache@v4
        with:
          path: cache
          key: fontes-${{ steps.semana.outputs.s }}
          restore-keys: fontes-

      # focos de anos fechados (recorte do AM) não mudam: cache próprio, renovado uma vez por ano
      - id: ano
        run: echo "a=$(date +%Y)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: cache/historico
          key: historico-${{ steps.ano.outputs.a }}
          restore-keys: historico-

      - run: python pipeline/build.py --saida site/data
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}   # opcional: estações AQICN (token grátis em aqicn.org/data-platform/token)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
