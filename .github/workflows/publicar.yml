name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia, 07:00 em Brasília: fecha o dia anterior
    - cron: "0 0 * * *"    # todo dia, 21:00 em Brasília: pega a passagem da tarde do satélite de referência
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # com cache o build leva ~10 min; o primeiro run (sem cache) baixa ~1 GB do INPE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: semana
        run: echo "s=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # CAR (~99 mil polígonos) e shapefiles ficam em cache por semana
      - uses: actions/cache@v4
        with:
          path: cache
          key: fontes-${{ steps.semana.outputs.s }}
          restore-keys: fontes-

      # focos de anos fechados (recorte do AM) não mudam: cache próprio, renovado uma vez por ano
      - id: ano
        run: echo "a=$(date +%Y)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: cache/historico
          key: historico-${{ steps.ano.outputs.a }}
          restore-keys: historico-

      - run: python pipeline/build.py --saida site/data
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}   # opcional: estações AQICN (token grátis em aqicn.org/data-platform/token)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # se o build ou o deploy quebrar, abre (ou comenta em) uma issue: o GitHub avisa por e-mail.
  # O site continua no ar com os dados da última atualização boa.
  avisar:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          titulo="Falha na atualização automática dos dados"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$titulo in:title" --json number --jq '.[0].number')
          corpo="A execução falhou em $(date -u '+%F %H:%M') UTC. Log: $LINK"
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$corpo"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" --body "$corpo"; fi
