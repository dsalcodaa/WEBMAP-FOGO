name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia, 07:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: semana
        run: echo "s=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # CAR (~99 mil polígonos) e shapefiles ficam em cache por semana
      - uses: actions/cache@v4
        with:
          path: cache
          key: fontes-${{ steps.semana.outputs.s }}
          restore-keys: fontes-

      - run: python pipeline/build.py --saida site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
